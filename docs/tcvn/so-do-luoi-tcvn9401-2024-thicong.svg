  <text x="68" y="960" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#f0fdfa"><tspan font-weight="700" fill="#4ade80">Liên kết độ chính xác (Điều 6.3.4):</tspan> MP điểm yếu 2,0 cm → quy địa lưới CS cấp 2 (KS CT); 1,5 cm → QT CD ngang cấp 4; ≤ 0,5 cm → QT cấp 1–2.</text>
